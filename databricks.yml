# Databricks Asset Bundle: LiDAR lakehouse (ADR-0016). Deploy from the repo root:
#   databricks bundle deploy && databricks bundle run lidar_ingest
bundle:
  name: echosense_lidar

include:
  - databricks/resources/*.yml

sync:
  # Only the pipeline code needs to reach the workspace (no wheel: the pipeline is pure Spark).
  include:
    - databricks/pipeline/*.py
    - databricks/training/*.py
    - mapper/src/lidar_mapper/detect.py   # the training job loads the detector code from here
  exclude:
    - "mapper/tests/**"
    - "mapper/models/**"
    - "ios/**"

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition workspaces ship with "workspace".
    default: workspace
  schema:
    description: Schema for LiDAR tables and the landing volume.
    default: echosense_lidar

targets:
  dev:
    mode: development
    default: true
